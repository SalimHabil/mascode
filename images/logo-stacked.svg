    <!-- White Geometric 'M' -->
    <path d="M10 15 L50 50 L90 15 L90 90 L72 90 L72 38 L50 58 L28 38 L28 90 L10 90 Z" fill="#FFFFFF"/>
    <!-- Cyan Downward Chevron -->
