<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ldrop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B65E2"/>
      <stop offset="100%" stop-color="#554ED0"/>
    </linearGradient>
    <linearGradient id="ldrop-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C75F2"/>
      <stop offset="100%" stop-color="#635BDB"/>
    </linearGradient>
    <linearGradient id="blue-upload-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5479F7"/>
      <stop offset="100%" stop-color="#4063E6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#ldrop-bg)"/>

  <!-- Top Navbar Bar -->
  <rect width="800" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="56" x2="800" y2="56" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Logo -->
  <g transform="translate(35, 17)">
    <rect width="22" height="24" rx="4" fill="#3B82F6"/>
    <path d="M 4,4 L 14,4 L 18,8 L 18,20 L 4,20 Z" fill="#FFFFFF" opacity="0.9"/>
    <rect x="7" y="9" width="8" height="2" fill="#3B82F6"/>
    <rect x="7" y="13" width="6" height="2" fill="#3B82F6"/>
  </g>
  <text x="66" y="34" font-family="'Space Grotesk', sans-serif" font-size="19" font-weight="800" fill="#0F172A">LedgDrop</text>

  <!-- Nav Links -->
  <text x="245" y="34" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#475569">Features</text>
  <text x="315" y="34" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#475569">How It Works</text>

  <!-- Active Pricing Nav Box -->
  <rect x="400" y="16" width="55" height="26" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
  <text x="427" y="33" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">Pricing</text>

  <!-- Header Action Buttons -->
  <rect x="585" y="14" width="70" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="620" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">➜] Sign In</text>

  <rect x="665" y="14" width="105" height="28" rx="14" fill="url(#ldrop-btn)"/>
  <text x="717" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">🚀 Start Free Trial</text>

  <!-- Left Content Column -->
  <text x="40" y="132" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">
    <tspan x="40" dy="0">Automate Document</tspan>
    <tspan x="40" dy="38">Collection From Your</tspan>
    <tspan x="40" dy="38">Clients</tspan>
  </text>

  <text x="40" y="240" font-family="'Inter', sans-serif" font-size="11.5" fill="#E2E8F0">
    <tspan x="40" dy="0">Stop chasing clients for documents via email and WhatsApp.</tspan>
    <tspan x="40" dy="18">LedgDrop automates requests, reminders, and collections — so you</tspan>
    <tspan x="40" dy="18">can focus on the books.</tspan>
  </text>

  <!-- Left Buttons -->
  <rect x="40" y="300" width="130" height="38" rx="8" fill="#FFFFFF"/>
  <text x="105" y="324" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">🚀 Start Free Trial</text>

  <rect x="180" y="300" width="140" height="38" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="250" y="324" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">▶ See How It Works</text>

  <text x="40" y="362" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">★ No credit card required · 14-day trial · 5 clients free</text>

  <!-- Right Visual Window Card -->
  <g transform="translate(415, 85)">
    <!-- White Card Base -->
    <rect width="350" height="315" rx="14" fill="#FFFFFF" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.25))"/>
    
    <!-- Window Control Dots -->
    <circle cx="20" cy="20" r="4.5" fill="#FF5F56"/>
    <circle cx="33" cy="20" r="4.5" fill="#FFBD2E"/>
    <circle cx="46" cy="20" r="4.5" fill="#27C93F"/>

    <!-- Document Request Header Box -->
    <rect x="16" y="40" width="318" height="68" rx="8" fill="#F8FAFC"/>
    <text x="30" y="60" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#2563EB">📄 Bank Statements - Jan 2026</text>
    <text x="30" y="78" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748B">Due: Feb 5, 2026</text>
    
    <!-- Progress Bar -->
    <rect x="30" y="88" width="290" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="30" y="88" width="190" height="5" rx="2.5" fill="#3B82F6"/>

    <!-- Uploaded File Card (Light Blue) -->
    <rect x="16" y="120" width="152" height="64" rx="8" fill="#EFF6FF"/>
    <text x="26" y="142" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">📄 Bank_Statement.pdf</text>
    <text x="26" y="162" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#16A34A">✔ Uploaded</text>

    <!-- Pending File Card (Light Yellow) -->
    <rect x="182" y="120" width="152" height="64" rx="8" fill="#FEF9C3"/>
    <text x="192" y="142" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">📄 Receipts.pdf</text>
    <text x="192" y="162" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#EAB308">🕒 Pending</text>

    <!-- Upload Action Button (Blue) -->
    <rect x="16" y="200" width="318" height="40" rx="8" fill="url(#blue-upload-btn)"/>
    <text x="175" y="225" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">📤 Upload Files</text>
  </g>
</svg>
