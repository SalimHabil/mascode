<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B53C" />
      <stop offset="50%" stop-color="#C88E1C" />
      <stop offset="100%" stop-color="#9A690B" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F7DF94" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA6" />
      <stop offset="100%" stop-color="#C88E1C" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Golden Tower / Obelisk Emblem -->
  <g transform="translate(100, 85)">
    <!-- Base Obelisk Body -->
    <path d="M-18 60 L-18 -15 L0 -55 L18 -15 L18 60 Z" fill="url(#goldGrad)" />
    <!-- Top Apex Facet Light -->
    <path d="M0 -55 L18 -15 L0 60 Z" fill="url(#goldHighlight)" opacity="0.3" />
    <!-- Dynamic Curved Swoosh Accent -->
    <path d="M-18 60 C -4 28, 4 -2, 18 -38 L18 -22 C 3 10, -5 32, -18 60 Z" fill="url(#swooshGrad)" filter="url(#subtleGlow)" />
  </g>

  <!-- Typography -->
  <text x="100" y="195" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="18" font-weight="700" letter-spacing="3" fill="#C88E1C" text-anchor="middle">INTERRA AI</text>
</svg>
